<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BatchMonitor - Publicador CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 650px;">
        <a href="index.html" class="btn btn-secondary btn-sm mb-3">← Volver al Dashboard</a>
        <div class="card shadow">
            <div class="card-header bg-warning text-dark font-weight-bold">
                <h4>Gestor de Contenido Operativo (CMS)</h4>
            </div>
            <div class="card-body">
                <form id="cmsForm">
                    <div class="mb-3">
                        <label class="form-label">Título del Comunicado</label>
                        <input type="text" id="cmsTitulo" class="form-control" placeholder="Ej. Mantenimiento Servidor Mainframe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prioridad del Aviso</label>
                        <select id="cmsPrioridad" class="form-select">
                            <option value="NORMAL">Normal</option>
                            <option value="ALTA">Alta / Crítica</option>
                            <option value="INFORMATIVA">Informativa</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contenido del Mensaje Operativo</label>
                        <textarea id="cmsContenido" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Publicar Aviso en Tablero CMS</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
