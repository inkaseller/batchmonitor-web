<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatchMonitor Web - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">BatchMonitor Web | Financiera Andina</a>
        <div class="d-flex align-items-center text-white gap-3">
            <span id="userInfo">Usuario: Franklin Merino (ADMIN)</span>
            <a href="cms.html" class="btn btn-outline-warning btn-sm">Módulo CMS</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container my-4">
        <!-- SECCIÓN CMS: AVISOS TÉCNICOS (PA3) -->
        <div class="card mb-4 border-warning">
            <div class="card-header bg-warning text-dark fw-bold">
                📢 AVISOS Y COMUNICADOS TÉCNICOS OPERATIVOS (MÓDULO CMS)
            </div>
            <div class="card-body" id="cmsContainer">
                <p class="text-muted">Cargando anuncios del CMS...</p>
            </div>
        </div>

        <!-- SECCIÓN TABLERO BATCH (PA1 / PA2) -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Gestión y Monitoreo de Procesos Batch</h5>
                <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalProceso">+ Registrar Proceso Batch</button>
            </div>
            <div class="card-body">
                <table class="table table-hover table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nombre Proceso</th>
                            <th>Frecuencia</th>
                            <th>Última Ejecución</th>
                            <th>Estado DB</th>
                        </tr>
                    </thead>
                    <tbody id="procesosTableBody">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
