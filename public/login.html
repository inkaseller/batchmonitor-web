<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatchMonitor Web - Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>BATCHMONITOR WEB</h4>
                        <small>Financiera Andina S.A.</small>
                    </div>
                    <div class="card-body p-4">
                        <!-- Alert Mensajes -->
                        <div id="alertMsg" class="alert d-none" role="alert"></div>

                        <!-- Formulario Login -->
                        <form id="loginForm">
                            <h5 class="mb-3">Inicio de Sesión</h5>
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" id="loginUsername" class="form-control" required placeholder="Ej. fmerino">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" id="loginPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Ingresar al Sistema</button>
                        </form>

                        <hr class="my-4">

                        <!-- Formulario Registro Operador (PA2) -->
                        <form id="registerForm">
                            <h5 class="mb-3">Registrar Nuevo Usuario / Operador</h5>
                            <div class="mb-2">
                                <input type="text" id="regNombre" class="form-control" placeholder="Nombre Completo" required>
                            </div>
                            <div class="mb-2">
                                <input type="email" id="regEmail" class="form-control" placeholder="Correo Electrónico" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" id="regUsername" class="form-control" placeholder="Nombre de Usuario" required>
                            </div>
                            <div class="mb-2">
                                <input type="password" id="regPassword" class="form-control" placeholder="Contraseña" required>
                            </div>
                            <div class="mb-3">
                                <select id="regRol" class="form-select">
                                    <option value="3">OPERADOR</option>
                                    <option value="2">SUPERVISOR</option>
                                    <option value="1">ADMINISTRADOR</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-success w-100">Guardar en Base de Datos</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
